# ARES Device Driver Manifest
# Target: Pololu Tic Stepper Controller

# Basic Metadata
device_type_name: "Pololu Tic Stepper Controller"
driver_id: "pololu_tic_stepper_v1"
connection_type: "Serial"

# The DLL that contains the TicStepperController and ViewModel classes
assembly_name: "TicStepperController.dll"

# Serial connection specifics
serial_settings:
  requires_unit_id: false
  variable_baud_rate: false
  allowed_baud_rates: [9600, 19200, 38400, 57600, 115200]
  default_baud_rate: 9600
  variable_protocol: false
  default_protocol: "TicStepperControllerProtocol"

# Settings required when adding the device through the ARES UI
settings:
  - key: "MaxAcceleration"
    display_name: "Max Acceleration"
    type: "number"
    description: "Max acceleration value for the spool"

  - key: "MaxDecceleration"
    display_name: "Max Decceleration"
    type: "number"
    description: "Max decceleration value for the spool"

  - key: "StartingSpeed"
    display_name: "Starting Speed"
    type: "number"
    description: "Starting speed value for the spool"

  - key: "MaxSpeed"
    display_name: "Max Speed"
    type: "number"
    description: "The max speed allowed for this spool"

  - key: "CurrentLimit"
    display_name: "Current Limit"
    type: "number"
    description: "The current limit for this spool"

  - key: "CustomStepSize"
    display_name: "User Step Size"
    type: "number"
    description: "Manual step size for move commands (default: 1)."

  - key: "StepMode"
    display_name: "Step Mode"
    type: "string"
    description: "The step mode this spool will be set to"
    constraints:
      options: 
        - "Step1_2" 
        - "Step1_4" 
        - "Step1_8"
        - "Step1_16"
        - "Step1_32"
        - "Step1_64"
        - "Step1_2_100"
        - "Step1_128"
        - "Step1_256"
  
  - key: "DynamicStepCalculation"
    display_name: "Use Spool Calculation"
    type: "boolean"
    description: "Enable automatic step size calculation based on spool geometry."

  - key: "StepAngle"
    display_name: "Motor Step Angle (deg)"
    type: "number"
    description: "The native step angle of the motor (usually 1.8). Only needed if dynamic step calculation is set to on."

  - key: "IdealLinearStepSize"
    display_name: "Ideal Linear Step (mm)"
    type: "number"
    description: "Target linear distance per user-triggered step. Only needed if dynamic step calculation is set to on."

  - key: "FilterPaperThickness"
    display_name: "Material Thickness (mm)"
    type: "number"
    description: "Thickness of one layer of material on the spool. Only needed if dynamic step calculation is set to on."

  - key: "SpoolRadius"
    display_name: "Initial Spool Radius (mm)"
    type: "number"
    description: "Radius of the spool with no paper/material. Only needed if dynamic step calculation is set to on."


