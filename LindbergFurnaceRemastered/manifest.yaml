# ARES Device Driver Manifest
# Target: Lindberg Tube Furnace

# Basic Metadata
device_type_name: "Lindberg Tube Furnace"
driver_id: "lindberg_tube_furnace_v1"
connection_type: "Serial"

# The DLL that contains the MassFlowController and ViewModel classes
assembly_name: "LindbergFurnaceRemastered.dll"

# Serial connection specifics (Parsed only if connection_type is "Serial")
serial_settings:
  requires_unit_id: true
  unit_id_regex: "^[0-9]+$"
  unit_id_validation_hint: "Address must be a numeric value (e.g. 1)."
  variable_baud_rate: false
  allowed_baud_rates: [9600, 19200, 38400, 57600, 115200]
  default_baud_rate: 9600
  variable_protocol: false
  default_protocol: "LindbergProtocol"

# Settings required when adding the device through the ARES UI
settings: []
